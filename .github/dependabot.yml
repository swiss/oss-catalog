version: 2

updates:
  # pnpm workspace (root + client)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/paseto/node"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 1
    groups:
      paseto-node:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/paseto/go"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 1
    groups:
      paseto-go:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
