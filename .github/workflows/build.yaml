name: Standalone build
on:
  schedule:
    - cron: "42 */6 * * *"
  push:
    branches:
      - "main"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build client
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/krypton
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Verify software count threshold
        run: |
          echo "Waiting 10 seconds for software data to be populated..."
          sleep 10
          echo "Checking software count..."
          response=$(curl -g -s https://oss-catalog-api.ocp.cloudscale.puzzle.ch/v1/software?page[size]=10000)
          software_count=$(echo "$response" | jq -r ".data | length")
          echo "Found $software_count software entries"
          if [ "$software_count" -lt 80 ]; then
            echo "Error: Software count ($software_count) is below threshold of 80"
            echo "Failing the pipeline to prevent deployment of incomplete catalog"
            exit 1
          fi
          echo "Software count verification passed: $software_count >= 80"
      - name: Build client with pnpm
        run: |
          pnpm install --frozen-lockfile --strict-peer-dependencies
          pnpm scope:client build
        env:
          API_BASEURL: https://oss-catalog-api.ocp.cloudscale.puzzle.ch/v1
          GIT_COMMIT_HASH: ${{ github.sha }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./client/dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
