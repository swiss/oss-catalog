description:
  en:
    shortDescription: Open Source Software Catalogue based on the Public Code standard.
    longDescription:
      The **Open Source Software Catalogue** provides an overview of
      free and open-source software developed by or for the Swiss Confederation.
      It is based on the [publiccode.yml](https://yml.publiccode.tools/)
      standard, which describes software in a machine-readable way, making it
      discoverable and understandable for both developers and non-technical
      users.
    features:
      - find open source project developed by federal authorities
    screenshots:
      - https://raw.githubusercontent.com/swiss/oss-catalog/refs/heads/main/doc/screenshot.png
